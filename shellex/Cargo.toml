[package]
name = "anycompare-shellex"
version = "0.2.16"
edition = "2021"
description = "Windows 11 / 10 Explorer context menu COM extension for AnyCompare"

[lib]
name = "anycompare_shellex"
crate-type = ["cdylib"]

[dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
