name: Build & Test (Windows, macOS Universal, Linux)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked -p anycompare -p anycompare-shellex --no-deps --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked -p anycompare

      - name: Build release
        run: cargo build --release --locked -p anycompare -p anycompare-shellex

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item target/release/anycompare.exe dist/stage/
          Copy-Item target/release/anycompare_shellex.dll dist/stage/AnyCompareShellEx64.dll
          Copy-Item README.md dist/stage/
          Compress-Archive -Path dist/stage/* -DestinationPath "dist/AnyCompare-windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyCompare-windows-x64
          path: dist/AnyCompare-windows-x64.zip

  build-macos:
    name: macOS Universal (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (arm64 + x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked -p anycompare --no-deps --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked -p anycompare

      - name: Build Universal binary (Apple Silicon + Intel)
        run: |
          cargo build --release --locked -p anycompare --target aarch64-apple-darwin
          cargo build --release --locked -p anycompare --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create \
            target/aarch64-apple-darwin/release/anycompare \
            target/x86_64-apple-darwin/release/anycompare \
            -output target/universal/anycompare
          lipo -info target/universal/anycompare

      - name: Create AnyCompare.app bundle & DMG
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n1 | cut -d'"' -f2)
          APP="dist/AnyCompare.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/universal/anycompare "$APP/Contents/MacOS/anycompare"
          chmod +x "$APP/Contents/MacOS/anycompare"
          printf 'APPL????' > "$APP/Contents/PkgInfo"

          # Build macOS .icns from assets/icons/app.png
          ICONSET="dist/AnyCompare.iconset"
          mkdir -p "$ICONSET"
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz assets/icons/app.png --out "$ICONSET/icon_${sz}x${sz}.png" >/dev/null
            sz2=$((sz * 2))
            sips -z $sz2 $sz2 assets/icons/app.png --out "$ICONSET/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AnyCompare.icns"
          rm -rf "$ICONSET"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>AnyCompare</string>
            <key>CFBundleDisplayName</key>
            <string>AnyCompare</string>
            <key>CFBundleIdentifier</key>
            <string>com.anycompare.app</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>anycompare</string>
            <key>CFBundleIconFile</key>
            <string>AnyCompare</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc sign so macOS Gatekeeper accepts the universal bundle structure
          codesign --force --deep --sign - "$APP"

          # Package .zip and .dmg
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/AnyCompare-macos-universal.zip"
          mkdir -p dist/dmg_root
          cp -R "$APP" dist/dmg_root/
          ln -s /Applications dist/dmg_root/Applications
          hdiutil create -volname "AnyCompare" -srcfolder dist/dmg_root -ov -format UDZO "dist/AnyCompare-macos-universal.dmg"
          rm -rf dist/dmg_root

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnyCompare-macos-universal
          path: |
            dist/AnyCompare-macos-universal.dmg
            dist/AnyCompare-macos-universal.zip

  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libasound2-dev \
            pkg-config \
            libssl-dev

      - name: Clippy
        run: cargo clippy --locked -p anycompare --no-deps --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked -p anycompare

      - name: Build release
        run: cargo build --release --locked -p anycompare

      - name: Package Linux archive
        run: |
          mkdir -p dist/stage
          cp target/release/anycompare dist/stage/
          cp assets/icons/app.png dist/stage/anycompare.png
          cp README.md dist/stage/
          cat > dist/stage/anycompare.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AnyCompare
          Comment=File & Folder Comparison and Merge
          Exec=anycompare %F
          Icon=anycompare
          Terminal=false
          Categories=Development;Utility;
          EOF
          tar -czf "dist/AnyCompare-linux-x64.tar.gz" -C dist/stage .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyCompare-linux-x64
          path: dist/AnyCompare-linux-x64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
