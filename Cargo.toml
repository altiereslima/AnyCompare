[workspace]
members = [".", "shellex"]
resolver = "2"

[package]
name = "anycompare"
version = "0.2.16"
edition = "2021"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[dependencies]
eframe = { version = "0.29.1", features = ["wgpu"] }
egui = "0.29.1"
similar = { version = "2.6", features = ["inline"] }
rfd = "0.15"
walkdir = "2.5"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "ico", "tiff", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
regex = "1.13.1"
raw-window-handle = "0.6"
calamine = { version = "0.38.0", features = ["dates"] }
csv = "1.4"
scraper = "0.27"
bigdecimal = "0.4.11"
sha2 = "0.10"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
crc32fast = "1.5.2"
quick-xml = "0.42"
arboard = { version = "3.6.1", default-features = false }
anycompare-media = { path = "vendor/media" }
anycompare-registry = { path = "vendor/registry" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }

[patch.crates-io]
egui = { path = "vendor/egui" }
epaint = { path = "vendor/epaint" }
