[package]
name = "anycompare-media"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Media Compare engine for a Rust file comparison application"
repository = ""

[lib]
name = "anycompare_media"
path = "src/lib.rs"

[dependencies]
lofty = "=0.25.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
blake3 = "1.8"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
open = "5.3"

[dev-dependencies]
tempfile = "3.23"
